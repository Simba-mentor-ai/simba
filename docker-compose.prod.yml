services:

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "5433:5433"
    command: ["postgres", "-c", "port=5433"]
    networks:
      - simba-network

  web:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - SIMBA_API_URL=http://web:8000/api
      - ENVIRONMENT=production
      - BASE_URL=https://simba-refact.irit.fr
      - EMAIL=${EMAIL}
      - EMAILAPPPWD=${EMAILAPPPWD}
    volumes:
      - web:/code
      - static_volume:/app/static
      - media_volume:/app/media
    entrypoint: ["sh", "/code/entrypoint.sh"]
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - simba-network
  
  chainlit:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - SIMBA_API_URL=http://web:8000/api
      - ENVIRONMENT=production
      - BASE_URL=https://simba-refact.irit.fr
      - EMAIL=${EMAIL}
      - EMAILAPPPWD=${EMAILAPPPWD}
    volumes:
      - web:/code
    command: ["chainlit", "run", "chainlit_app.py", "--host", "0.0.0.0", "--port", "8500"]
    ports:
      - "8500:8500"
    depends_on:
      - db
      - web
    networks:
      - simba-network
  


volumes:
  db:
  web:
  static_volume:
  media_volume:

networks:
  simba-network:
    driver: bridge
