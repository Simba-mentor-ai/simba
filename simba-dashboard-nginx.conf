# ==============================================================================
# SIMBA — Configuration Nginx pour simba-dashboard.irit.fr
# ==============================================================================
# À placer dans /etc/nginx/sites-available/simba-dashboard.conf puis activer avec :
#   sudo ln -s /etc/nginx/sites-available/simba-dashboard.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# NOTE IMPORTANTE : l'état des lieux de la VM montre que c'est NGINX qui écoute déjà
# sur le port 80 (probablement pour Moodle), pas Apache — même si Apache est installé.
# Ce fichier remplace donc le vhost Apache fourni précédemment. Si tu préfères
# repasser sur Apache (comme suggéré par William), dis-le moi, mais ça veut dire
# arrêter Nginx et lui reprendre le port 80/443, ce qui est plus perturbateur que de
# simplement reconfigurer Nginx pour SIMBA une fois Moodle retiré.
# ==============================================================================

# --- Redirection HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name simba-dashboard.irit.fr;

    # Nécessaire pour la validation du certificat Let's Encrypt (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Site principal en HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name simba-dashboard.irit.fr;

    ssl_certificate     /etc/letsencrypt/live/simba-dashboard.irit.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simba-dashboard.irit.fr/privkey.pem;

    client_max_body_size 20M;

    access_log /var/log/nginx/simba_access.log;
    error_log  /var/log/nginx/simba_error.log;

    # --- Chainlit (le chat) sous /chainlit/, avec support WebSocket ---
    location /chainlit/ {
        proxy_pass http://127.0.0.1:8500/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;   # le chat peut rester ouvert longtemps (WebSocket)
    }

    # --- Application Django (tout le reste) ---
    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
