services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "5433:5433"
    command: ["postgres", "-c", "port=5433"]
    networks:
      - simba-network

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - SIMBA_API_URL=http://web:8000/api
      - EMAIL=${EMAIL}
      - EMAILAPPPWD=${EMAILAPPPWD}
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    entrypoint: ["sh", "/code/entrypoint.sh"]
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - simba-network
  
  chainlit:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - SIMBA_API_URL=http://web:8000/api
      - EMAIL=${EMAIL}
      - EMAILAPPPWD=${EMAILAPPPWD}
    command: ["sh", "-c", "chainlit run chainlit_app.py --host 0.0.0.0 --port 8500 ${CHAINLIT_ROOT_PATH:+--root-path $CHAINLIT_ROOT_PATH}"]
    ports:
      - "8500:8500"
    depends_on:
      - db
      - web
    networks:
      - simba-network
  
  

volumes:
  db:
  static_volume:
  media_volume:

networks:
  simba-network:
    driver: bridge