server {
    listen 80;
    listen [::]:80;
    server_name simba-dashboard.irit.fr;
    client_max_body_size 20M;
    access_log /var/log/nginx/simba_access.log;
    error_log  /var/log/nginx/simba_error.log;

    # --- Redirection automatique pour le slash manquant ---
    location = /chainlit {
        return 301 /chainlit/;
    }

    # --- Chainlit (le chat) ---
    # IMPORTANT : proxy_pass n'a PAS d'URI après l'hôte:port (pas de "/" final).
    # Nginx transmet alors le chemin d'origine tel quel (avec le préfixe /chainlit/
    # inclus) à Chainlit, au lieu de le retirer. C'est indispensable pour que ça
    # corresponde à --root-path /chainlit passé à Chainlit côté docker-compose.yml
    # (sans ça, Chainlit ne sait pas qu'il est monté sous /chainlit/ et son JS
    # appelle /auth/config, /user, etc. à la racine du domaine -> 404 -> page blanche).
    location /chainlit/ {
        proxy_pass http://127.0.0.1:8500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    # --- Application Django (tout le reste) ---
    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
